services:
  api:
    build: .
    environment:
      DATABASE_URL: postgresql://hr0d:hr0d@postgres:5432/hr0d
      CONTENT_KEY: ${CONTENT_KEY:-dev-content-key}
    ports:
      - "8000:8000"
    depends_on:
      - postgres
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: hr0d
      POSTGRES_PASSWORD: hr0d
      POSTGRES_DB: hr0d
    volumes:
      - pgdata:/var/lib/postgresql/data
  minio:
    image: minio/minio:latest
    command: server /data
    environment:
      MINIO_ROOT_USER: hr0d
      MINIO_ROOT_PASSWORD: hr0d-hr0d-hr0d
    ports:
      - "9000:9000"
    volumes:
      - miniodata:/data
volumes:
  pgdata:
  miniodata:
